<!DOCTYPE html>
<html>

<head>
    <title>AUV 3D Viewer</title>
    <link rel="icon" type="image/png" href="../auv logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        html {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .viewer-hud {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 100;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .viewer-hud img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 200, 255, 0.6));
        }

        .viewer-hud h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: #00c8ff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        }

        .viewer-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            background: rgba(2, 22, 60, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 200, 255, 0.25);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="viewer-hud">
        <img src="../auv logo.png" alt="AUV Logo">
        <h1 id="modelBadge">AUV 3D Viewer</h1>
    </div>
    <div class="viewer-instructions">
        Drag mouse to rotate | Scroll to zoom | WASD to steer
    </div>
    <canvas id="canvas"></canvas>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.113.0"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/three@v0.113.0/examples/js/controls/TrackballControls.js"></script>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/three@v0.113.0/examples/js/loaders/GLTFLoader.js"></script>
    <script type="text/javascript" src="main.js?v=31"></script>
</body>

</html>
