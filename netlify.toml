# Netlify configuration for AUV IIITDM website

[build]
  publish = "."

# ── Aggressive caching for static assets ────────────────────────────────────
# Images, fonts, GLBs — cached for 1 year (they're content-hashed or rarely change)
[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/Fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/WaterEffect/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/webgl-water/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/webgl-water/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS/CSS — cache for 1 day (can change more often)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML — no cache so users always get latest
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
