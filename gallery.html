<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUV IIITDM - Gallery</title>
    <link rel="icon" type="image/png" href="auv logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=30">
    <style>

        /* ─── Filter Pills ──────────────────────────── */
        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 24px 0 36px;
        }

        .filter-pill {
            padding: 7px 20px;
            border-radius: 50px;
            border: 1.5px solid rgba(0, 200, 255, 0.35);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.22s ease;
            white-space: nowrap;
            user-select: none;
        }

        .filter-pill:hover {
            border-color: #00c8ff;
            color: #00c8ff;
        }

        .filter-pill.active {
            background: #00c8ff;
            border-color: #00c8ff;
            color: #000;
            font-weight: 700;
        }

        /* ─── Timeline ──────────────────────────────── */
        .timeline-wrapper {
            position: relative;
            padding: 20px 5vw 80px;
        }

        /* vertical spine */
        .timeline-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(0, 200, 255, 0.5) 10%, rgba(0, 200, 255, 0.5) 90%, transparent);
            transform: translateX(-50%);
        }

        /* each section row */
        .timeline-section {
            margin-bottom: 70px;
        }

        .timeline-section-label {
            text-align: center;
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-section-label span {
            display: inline-block;
            background: rgba(0, 200, 255, 0.15);
            border: 1.5px solid rgba(0, 200, 255, 0.5);
            color: #00c8ff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 6px 22px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }

        /* ─── Polaroid grid per section ─────────────── */
        .polaroid-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 32px;
            padding: 0 20px;
        }

        .polaroid {
            background: #fff;
            border-radius: 4px;
            padding: 10px 10px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(.25, .46, .45, .94), box-shadow 0.35s ease;
            position: relative;
            max-width: 380px;
            will-change: transform;
        }

        /* random rotation classes */
        .rot-l2 {
            transform: rotate(-2.5deg);
        }

        .rot-l1 {
            transform: rotate(-1.2deg);
        }

        .rot-0 {
            transform: rotate(0deg);
        }

        .rot-r1 {
            transform: rotate(1.2deg);
        }

        .rot-r2 {
            transform: rotate(2.5deg);
        }

        .rot-r3 {
            transform: rotate(3.5deg);
        }

        .rot-l3 {
            transform: rotate(-3.5deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05) translateY(-6px) !important;
            box-shadow: 0 20px 60px rgba(0, 200, 255, 0.25), 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            display: block;
            border-radius: 2px;
            object-fit: contain;
            /* keeps original ratio */
            max-height: 340px;
        }

        .polaroid-caption {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Caveat', 'Patrick Hand', cursive, sans-serif;
            font-size: 0.92rem;
            color: #333;
            line-height: 1.2;
            padding: 0 10px;
        }

        /* ─── Lightbox ──────────────────────────────── */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        #lightbox.open {
            display: flex;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 6px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        #lightbox-close {
            position: fixed;
            top: 22px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        #lightbox-close:hover {
            opacity: 1;
        }

        #lightbox-caption {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 1rem;
        }

        .gallery-label {
            font-size: 0.78rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #00c8ff;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .no-results {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            padding: 60px 0;
        }

        /* Pin dot on spine */
        .spine-dot {
            width: 12px;
            height: 12px;
            background: #00c8ff;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -6px;
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.7);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="hero" style="min-height: 100vh;">
        <div class="background container-fluid">
            <div class="unicorn-embed" id="galleryWaterEffect"></div>
        </div>
        <div class="overlay-hero">

            <nav>
                <a href="index.html" class="brand-link">
                    <img src="auv logo.png" alt="AUV Logo" class="brand-logo-img">
                    <span>AUV IIITDM</span>
                </a>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="cntr-nav">
                    <a href="about.html" class="nav-hover-btn">About</a>
                    <a href="achievements.html" class="nav-hover-btn">Achievements</a>
                    <a href="vehicles.html" class="nav-hover-btn">Vehicles</a>
                    <a href="gallery.html" class="nav-hover-btn active">Gallery</a>
                    <a href="sponsors.html" class="nav-hover-btn">Sponsors</a>
                    <a href="team.html" class="nav-hover-btn">Team Hub</a>
                    <a href="contact.html" class="nav-hover-btn">Contact</a>
                </div>
            </nav>

            <div class="page-section pb-0">
                <div class="page-container text-center">
                    <h1 class="section-title mb-2">Our Visual Journey</h1>
                    <p style="color: rgba(255,255,255,0.5); font-size: 0.97rem; max-width: 460px; margin: 0 auto;">
                    </p>
                </div>

                <!-- Filter pills -->
                <div class="filter-pills" id="filterPills">
                    <span class="filter-pill active" data-cat="all">All</span>
                    <span class="filter-pill" data-cat="amurov">AMUROVc</span>
                    <span class="filter-pill" data-cat="aquavision">AquaVision</span>
                    <span class="filter-pill" data-cat="vehicles">Vehicles</span>
                </div>

                <!-- No results -->
                <div class="no-results" id="noResults" style="display:none;">No photos in this category.</div>

                <!-- Timeline -->
                <div class="timeline-wrapper" id="timelineWrapper">
                    <div class="timeline-spine"></div>
                    <!-- sections rendered by JS -->
                </div>

            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox">
        <span id="lightbox-close">&#x2715;</span>
        <img id="lightbox-img" src="" alt="" loading="lazy">
        <div id="lightbox-caption"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.unicorn.studio/v1.3.2/unicornStudio.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="script.js?v=27"></script>
    <script>
        // ============================================================
        //  PHOTO DATA   (ordered by category, newest first)
        //  cat values must match filter-pill data-cat
        // ============================================================
        const SECTIONS = [
            {
                title: "AMUROVc",
                cat: "amurov",
                photos: [
                    { src: "Assets/gallery/2.png", caption: "AMUROV 2026" },
                ]
            },
            {
                title: "AquaVision",
                cat: "aquavision",
                photos: [
                    { src: "Assets/gallery/3.png", caption: "AquaVision 2026" },
                    { src: "Assets/gallery/4.png", caption: "AquaVision 2026" },
                ]
            },
            {
                title: "Our Vehicles",
                cat: "vehicles",
                photos: [
                    { src: "Assets/gallery/1.png", caption: "AUV Fleet" },
                ]
            },
        ];

        const ROTS = ['rot-l2', 'rot-l1', 'rot-0', 'rot-r1', 'rot-r2', 'rot-r3', 'rot-l3'];

        function rot(i) { return ROTS[i % ROTS.length]; }

        function buildTimeline(activecat) {
            const wrapper = document.getElementById('timelineWrapper');
            // keep the spine, remove sections
            wrapper.querySelectorAll('.timeline-section').forEach(el => el.remove());

            const filtered = activecat === 'all'
                ? SECTIONS
                : SECTIONS.filter(s => s.cat === activecat);

            if (filtered.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            }
            document.getElementById('noResults').style.display = 'none';

            filtered.forEach((section, si) => {
                const sec = document.createElement('div');
                sec.className = 'timeline-section';

                const dotDiv = document.createElement('div');
                dotDiv.style.position = 'relative';
                dotDiv.innerHTML = '<div class="spine-dot"></div>';

                const label = document.createElement('div');
                label.className = 'timeline-section-label';
                label.innerHTML = `<span>${section.title}</span>`;

                const grid = document.createElement('div');
                grid.className = 'polaroid-grid';

                section.photos.forEach((photo, pi) => {
                    const card = document.createElement('div');
                    card.className = `polaroid ${rot(si + pi)}`;
                    card.innerHTML = `
                        <img src="${photo.src}" alt="${photo.caption}"
                             onerror="this.parentElement.style.background='rgba(0,200,255,0.1)'; this.style.display='none';" loading="lazy">
                        <div class="polaroid-caption">${photo.caption}</div>
                    `;
                    card.addEventListener('click', () => openLightbox(photo.src, photo.caption));
                    grid.appendChild(card);
                });

                sec.appendChild(dotDiv);
                sec.appendChild(label);
                sec.appendChild(grid);
                wrapper.appendChild(sec);
            });

            // Animate polaroids in with GSAP
            if (window.gsap) {
                gsap.from('.polaroid', {
                    opacity: 0,
                    y: 40,
                    scale: 0.9,
                    duration: 0.6,
                    stagger: 0.07,
                    ease: 'back.out(1.2)',
                });
            }
        }

        // ─── Filter pills ────────────────────────────────
        document.getElementById('filterPills').addEventListener('click', e => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            buildTimeline(pill.dataset.cat);
        });

        // ─── Lightbox ─────────────────────────────────────
        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').textContent = caption;
            document.getElementById('lightbox').classList.add('open');
        }
        document.getElementById('lightbox').addEventListener('click', e => {
            if (e.target === document.getElementById('lightbox') ||
                e.target.id === 'lightbox-close') {
                document.getElementById('lightbox').classList.remove('open');
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
        });

        // ─── Init ─────────────────────────────────────────
        buildTimeline('all');
    </script>
    <script src="script.js?v=28"></script>
</body>

</html>
